name: URQR CI Pipeline

# =============================================================================
# URQR Platform — Phase 1 Baseline CI Pipeline
# Nelja Tech | Assignee: Prajwal B N | Role: Overall Lead & System Architect
#
# Jobs:
#   1. frontend-lint   — pnpm lint + TypeScript validation (manager-pos app)
#   2. backend-test    — Maven clean test for urqr-server (Spring Boot / Java 21)
#   3. bridge-verify   — Go module verify + vet for urqr-bridge (Go 1.27.4)
#   4. stack-summary   — Final gate: all jobs must pass
#
# Triggers: push to any branch, PR to main/develop
# =============================================================================

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # Job 1 — Frontend: pnpm lint + TypeScript validation
  # Runs only when frontend/** or packages/** files change.
  # Does NOT modify frontend code — only validates it.
  # ===========================================================================
  frontend-lint:
    name: "Frontend — pnpm Lint & TypeScript"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm run typecheck || pnpm exec tsc --noEmit
        continue-on-error: false

      - name: Lint
        run: pnpm run lint
        continue-on-error: false

  # ===========================================================================
  # Job 2 — Backend: Maven clean test (Spring Boot / Java 21)
  # Runs urqr-server unit tests with an in-memory H2 datasource override.
  # Secrets are injected via GitHub Actions environment secrets.
  # ===========================================================================
  backend-test:
    name: "Backend — Maven Test (Java 21)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/urqr-server

    env:
      # Injected from GitHub Actions repository secrets (see docs/secrets-reference.md)
      DB_URL:                   jdbc:h2:mem:urqr_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      DB_USER:                  sa
      DB_PASSWORD:              ""
      JWT_SECRET:               ${{ secrets.JWT_SECRET }}
      JWT_TTL_MINUTES:          "60"
      PLATFORM_ADMIN_USERNAME:  ${{ secrets.PLATFORM_ADMIN_USERNAME }}
      PLATFORM_ADMIN_PASSWORD:  ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      SETUP_SECRET:             ${{ secrets.SETUP_SECRET }}
      PLATFORM_ADMIN_SECRET:    ${{ secrets.PLATFORM_ADMIN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test -B -Dspring.profiles.active=test
        env:
          MAVEN_OPTS: "-Xmx1g"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: backend/urqr-server/target/surefire-reports/
          retention-days: 7

  # ===========================================================================
  # Job 3 — Go Bridge: module verify + vet (Go 1.27.4)
  # Runs only when backend/urqr-bridge/** files change.
  # ===========================================================================
  bridge-verify:
    name: "Bridge — Go Verify & Vet (Go 1.27.4)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/urqr-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.27.4
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: backend/urqr-bridge/go.sum

      - name: Verify module integrity
        run: go mod verify

      - name: Tidy check (no uncommitted go.sum changes)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build (compile check)
        run: go build ./...

  # ===========================================================================
  # Job 4 — Final gate: all jobs must succeed
  # ===========================================================================
  ci-gate:
    name: "CI Gate — All Checks Passed"
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-test, bridge-verify]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.frontend-lint.result }}"  == "failure" ||
                "${{ needs.backend-test.result }}"   == "failure" ||
                "${{ needs.bridge-verify.result }}"  == "failure" ]]; then
            echo "One or more CI jobs failed. Blocking merge."
            exit 1
          fi
          echo "========================================"
          echo "  URQR CI PIPELINE — ALL JOBS PASSED   "
          echo "========================================"
