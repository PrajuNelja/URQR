spring.application.name=urqr-server
spring.config.import=optional:file:./backend/urqr-server/.env[.properties],optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5434}/urqr}
spring.datasource.username=${APP_DB_USER:urqr_app}
spring.datasource.password=${APP_DB_PASSWORD:NeljaTeck}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.url=${DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5434}/urqr}
spring.flyway.user=${DB_MIGRATION_USER:urqr}
spring.flyway.password=${DB_MIGRATION_PASSWORD:NeljaTeck}
spring.flyway.placeholders.appDbPassword=${APP_DB_PASSWORD:NeljaTeck}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:32}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:16}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:4}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:2s}
app.security.authorization-cache-ttl-seconds=${AUTHORIZATION_CACHE_TTL_SECONDS:15}
app.centrifugo.api-url=${CENTRIFUGO_API_URL:http://localhost:8000/api}
app.centrifugo.api-key=${CENTRIFUGO_API_KEY:}
app.centrifugo.token-hmac-secret=${CENTRIFUGO_TOKEN_SECRET:}
app.centrifugo.token-ttl-seconds=${CENTRIFUGO_TOKEN_TTL_SECONDS:300}
app.idempotency.response-ttl-seconds=${IDEMPOTENCY_RESPONSE_TTL_SECONDS:86400}
app.outbox.enabled=${OUTBOX_ENABLED:false}
app.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:50}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.port=${API_PORT:8080}

spring.threads.virtual.enabled=true
spring.main.keep-alive=true

app.jwt.rsa.private-key=${JWT_PRIVATE_KEY:}
app.jwt.rsa.public-key=${JWT_PUBLIC_KEY:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.platform-admin.username=${PLATFORM_ADMIN_USERNAME:NeljaTechh}
app.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:NeljaTech2026}
