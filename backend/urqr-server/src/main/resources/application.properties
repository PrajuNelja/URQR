spring.application.name=urqr-server
spring.config.import=optional:file:./backend/urqr-server/.env[.properties],optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/urqr}
spring.datasource.username=${DB_USER:urqr}
spring.datasource.password=${DB_PASSWORD:Prajval@029}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
app.security.authorization-cache-ttl-seconds=${AUTHORIZATION_CACHE_TTL_SECONDS:15}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.port=8082

spring.threads.virtual.enabled=true
spring.main.keep-alive=true

app.jwt.rsa.private-key=${JWT_PRIVATE_KEY:}
app.jwt.rsa.public-key=${JWT_PUBLIC_KEY:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.platform-admin.username=${PLATFORM_ADMIN_USERNAME:NeljaTech}
app.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:NeljaTech2026}
