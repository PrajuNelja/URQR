services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urqr}
      POSTGRES_USER: ${DB_MIGRATION_USER:-urqr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/urqr-server/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data-v3:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    command: ["centrifugo", "--config=/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-urqr-local-token-secret-change-me}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-urqr-local-api-key-change-me}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-urqr-local-admin-password-change-me}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-urqr-local-admin-secret-change-me}
    volumes:
      - ../../infrastructure/docker/centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "127.0.0.1:${CENTRIFUGO_HTTP_PORT:-8000}:8000"
      - "127.0.0.1:${CENTRIFUGO_METRICS_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: backend/urqr-server/Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-urqr}
      APP_DB_USER: ${APP_DB_USER:-urqr_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in backend/urqr-server/.env}}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-urqr}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in backend/urqr-server/.env}}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in backend/urqr-server/.env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY in backend/urqr-server/.env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:?Set PLATFORM_ADMIN_USERNAME in backend/urqr-server/.env}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD in backend/urqr-server/.env}
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-urqr-local-api-key-change-me}
      OUTBOX_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  postgres-data-v3:
  redis-data:
