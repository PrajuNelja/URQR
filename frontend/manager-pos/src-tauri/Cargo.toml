[package]
name = "urqr-manager-pos"
version = "1.0.0"
description = "URQR Standalone Manager POS Desktop Application"
authors = ["NELJA TECH"]
edition = "2021"

[lib]
name = "urqr_manager_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
