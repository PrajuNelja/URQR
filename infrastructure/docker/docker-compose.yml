# =============================================================================
# URQR Platform — Phase 1 Developer Environment
# Nelja Tech | Assignee: Prajwal B N | Role: Overall Lead & System Architect
#
# Stack: PostgreSQL 18.7 → PgBouncer → Spring Boot app
#        Redis 8.2.11, Centrifugo 6.10.3
#
# BANNED: Kafka, Kubernetes, microservices (see .github/workflows/stack-compliance.yml)
# =============================================================================
#
# Usage (always run from P:\URQR — the project root):
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env ps
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env logs -f
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env down -v
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 18.7 — Primary relational store
  # Exposed on host port ${POSTGRES_PORT:-5433} for DBA / admin tooling.
  # App connects via PgBouncer on host port 5432.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.7-alpine
    container_name: urqr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-urqr}
      POSTGRES_USER:     ${DB_USER:-urqr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # direct DBA/admin access
    networks:
      - urqr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-urqr} -d ${POSTGRES_DB:-urqr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # PgBouncer — Connection pool in front of PostgreSQL
  # Uses the official pgbouncer/pgbouncer image (bitnami went commercial).
  # App / Spring Boot connects here: host port 5432 → container port 5432
  # Direct PostgreSQL is on POSTGRES_PORT (5433) — admin only.
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: pgbouncer/pgbouncer:1.23.1
    container_name: urqr_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Official image env vars use DATABASES_ and PGBOUNCER_ prefixes
      DATABASES_HOST:              postgres
      DATABASES_PORT:              "5432"
      DATABASES_DBNAME:            ${POSTGRES_DB:-urqr}
      DATABASES_USER:              ${DB_USER:-urqr}
      DATABASES_PASSWORD:          ${DB_PASSWORD:?DB_PASSWORD is required}
      # Pool tuning
      PGBOUNCER_POOL_MODE:         transaction
      PGBOUNCER_MAX_CLIENT_CONN:   "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_MIN_POOL_SIZE:     "5"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_RESERVE_POOL_TIMEOUT: "5"
      PGBOUNCER_SERVER_IDLE_TIMEOUT:  "600"
      PGBOUNCER_MAX_DB_CONNECTIONS:   "50"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
      PGBOUNCER_AUTH_TYPE:         scram-sha-256
      PGBOUNCER_STATS_USERS:       ${DB_USER:-urqr}
    ports:
      - "5432:5432"      # app-facing pool (host:container)
    networks:
      - urqr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER:-urqr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Redis 8.2.11 — Cache / session / rate-limit store
  # Password-protected via REDIS_PASSWORD.
  # Exposed on host port ${REDIS_PORT:-6379}.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.2.11-alpine
    container_name: urqr_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - urqr_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Centrifugo 6.10.3 — Real-time messaging / WebSocket hub
  # HTTP API  → 8000  (health probe, backend publish)
  # WebSocket → 8001  (frontend client connections)
  # Metrics   → 9000  (Prometheus scrape)
  # ---------------------------------------------------------------------------
  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    container_name: urqr_centrifugo
    restart: unless-stopped
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"    # HTTP API (task spec port)
      - "8001:8001"    # WebSocket
      - "9000:9000"    # Prometheus metrics
    networks:
      - urqr_net
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET is required}
      CENTRIFUGO_API_KEY:               ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_ADMIN_PASSWORD:        ${CENTRIFUGO_ADMIN_PASSWORD:-NeljaTech2026}
      CENTRIFUGO_ADMIN_SECRET:          ${CENTRIFUGO_ADMIN_SECRET:-urqr_centrifugo_admin_secret}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Network — isolated bridge for all URQR dev services
# =============================================================================
networks:
  urqr_net:
    driver: bridge
    name: urqr_dev_network
