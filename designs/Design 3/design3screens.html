<div class="lg" id="lg"><div class="lgl"><div class="brand">slip<i>.</i></div><p>Take the order.<br>Collect payment.<br>Hand over the slip.</p><div class="rc"><b>#0042</b><span>2 × Oat Latte</span><span>1 × Hawaiian Pizza</span><hr><span>Total ₹ 878.85</span></div></div>

<script>
const $=s=>document.querySelector(s),R=n=>'₹'+(+n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const M0=[['Oat Latte','Coffee','☕',180],['Matcha Latte','Coffee','🍵',210],['Chai Latte','Coffee','🫖',150],['Cold Brew','Coffee','🧊',190],['Mushroom Risotto','Main Course','🍚',420],['Seared Teriyaki','Main Course','🍱',560],['Grilled Sandwich','Main Course','🥪',240],['Spicy Tuna Roll','Main Course','🍣',380],['Hawaiian Pizza','Pizza','🍕',450],['Margherita Pizza','Pizza','🍕',380],['Butter Croissant','Bakery','🥐',120],['Sourdough Loaf','Bakery','🍞',260],['Berry Crepe','Dessert','🥞',220],['Ice Cream Pie','Dessert','🍰',240],['Onion Rings','Main Course','🧅',160]];
function seed(){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 const menu=M0.map((m,i)=>({id:i+1,n:m[0],c:m[1],e:m[2],p:m[3],cost:Math.round(m[3]*.4),stock:20+Math.floor(r()*30),on:i!==14}));
 const orders=[];let seq=0;const now=Date.now();

  orders.push(mk(++seq,t.getTime(),['Walk-in','Priya','Arjun','Meera','Sam'][Math.floor(r()*5)],r()>.4?'Dine-in':'Takeaway',items,0,['Cash','Card','UPI'][Math.floor(r()*3)],'served'))}}
 return{menu,orders,seq}}

<div class="c">${dup?'*** DUPLICATE COPY ***':'Show this slip at the kitchen counter'}</div><div class="tok">${tok(o.id)}</div><div class="c">${o.type}</div><hr>
<div class="r"><span>${new Date(o.t).toLocaleDateString('en-IN')}</span><span>${new Date(o.t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span></div><hr>
${o.items.map(i=>`<div class="r"><span>${i.q} × ${esc(i.n)}</span><span>${R(i.p*i.q)}</span></div>`).join('')}<hr>
<div class="r"><span>Subtotal</span><span>${R(o.sub)}</span></div><div class="r"><span>GST 5%</span><span>${R(o.tax)}</span></div>

function totals(){const it=cartItems(),sub=it.reduce((a,i)=>a+i.p*i.q,0),d=0,tax=(sub-d)*TAX;return{it,sub,d,tax,total:sub-d+tax}}
function add(id,n){const m=S.menu.find(x=>x.id==id),cur=cart[id]||0;if(n>0&&!m.on){toast('Item is inactive');return}if(cur+n>m.stock){toast('Only '+m.stock+' left');return}if(cur+n<=0)delete cart[id];else cart[id]=cur+n;render(true)}

 t.it.forEach(i=>{S.menu.find(m=>m.id==i.id).stock-=i.q});S.orders.push(o);save();cart={};form.cash='';lastTok=id;render();showSlip(o)}

 const gs=CATS.map(c=>({c,items:rows.filter(m=>m.c===c)})).filter(g=>g.items.length);

function agg(os){const days={},items={},pays={};os.forEach(o=>{const d=ymd(o.t);days[d]=days[d]||{n:0,v:0};days[d].n++;days[d].v+=o.total;pays[o.pay]=(pays[o.pay]||0)+o.total;o.items.forEach(i=>{items[i.n]=items[i.n]||{q:0,v:0};items[i.n].q+=i.q;items[i.n].v+=i.p*i.q})});
 return{days,items:Object.entries(items).sort((a,b)=>b[1].v-a[1].v),pays,rev:os.reduce((a,o)=>a+o.total,0),prof:os.reduce((a,o)=>a+ordProfit(o),0),tax:os.reduce((a,o)=>a+o.tax,0),disc:os.reduce((a,o)=>a+o.disc,0),n:os.length}}
let per='weekly',pd=ymd(Date.now()),pm=ymd(Date.now()).slice(0,7),pf='All';

function range(){if(per==='daily')return[pd,pd];if(per==='weekly'){const f=AD(pd,-((PD(pd).getDay()+6)%7));return[f,AD(f,6)]}if(per==='monthly'){const[y,m]=pm.split('-').map(Number);return[pm+'-01',ymd(new Date(y,m,0))]}return tf<=tt?[tf,tt]:[tt,tf]}
function plabel(){const[f,t]=range();if(per==='daily')return DF(f,{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(per==='monthly')return DF(f,{month:'long',year:'numeric'});return DF(f,{day:'numeric',month:'short'})+' – '+DF(t,{day:'numeric',month:'short',year:'numeric'})}
function vReports(){const[f,t]=range(),os=inRange(f,t),a=agg(os),top=[...a.items].sort((x,y)=>y[1].q-x[1].q).slice(0,5),mq=top.length?top[0][1].q:1,PCL={Cash:'var(--acc)',UPI:'var(--ok)',Card:'var(--ink)'},pmx=['Cash','UPI','Card'].map(k=>{const x=os.filter(o=>o.pay===k);return{k,n:x.length,v:x.reduce((z,o)=>z+o.total,0)}}),chg=os.reduce((z,o)=>z+(o.change||0),0);
 const ol=S.orders.filter(o=>o.status!=='void'&&ymd(o.t)>=f&&ymd(o.t)<=t&&(pf==='All'||o.pay===pf)&&tok(o.id).toLowerCase().includes(rq.toLowerCase())).sort((x,y)=>y.t-x.t);
 const inp=per==='daily'?`<input type="date" id="pdi" value="${pd}" max="${ymd(Date.now())}" onchange="pd=this.value||pd;render()">`:per==='weekly'?`<input type="date" id="pdi" value="${pd}" title="Pick any date in the week" onchange="pd=this.value||pd;render()">`:per==='monthly'?`<input type="month" id="pmi" value="${pm}" onchange="pm=this.value||pm;render()">`:`<input type="date" id="tfi" value="${tf}" onchange="tf=this.value||tf;render()"><span>to</span><input type="date" id="tti" value="${tt}" onchange="tt=this.value||tt;render()">`;
